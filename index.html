<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #121214; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 600px; background: #1a1a1e; border: 1px solid #2e2e33; border-radius: 8px; display: flex; flex-direction: column; height: 85vh; }
        .top-bar { display: flex; gap: 10px; padding: 15px; border-bottom: 1px solid #2e2e33; background: #16161a; }
        .top-bar input { background: #121214; border: 1px solid #2e2e33; color: #fff; padding: 8px; border-radius: 4px; outline: none; }
        #nodeAlias { width: 120px; }
        #cryptoSeed { flex: 1; }
        .feed { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { display: flex; flex-direction: column; max-width: 80%; padding: 10px; border-radius: 8px; }
        .me { align-self: flex-end; background: #233b5c; }
        .them { align-self: flex-start; background: #2d3748; }
        .meta { font-size: 11px; color: #71717a; margin-bottom: 4px; }
        .input-area { display: flex; padding: 15px; border-top: 1px solid #2e2e33; background: #16161a; gap: 10px; }
        .input-area input { flex: 1; background: #121214; border: 1px solid #2e2e33; color: #fff; padding: 12px; border-radius: 4px; outline: none; }
        .input-area button { background: #3b82f6; color: #fff; border: none; padding: 0 20px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="top-bar">
            <input type="text" id="nodeAlias" value="User_A">
            <input type="password" id="cryptoSeed" value="secret-passphrase">
        </div>
        <div class="feed" id="viewport"></div>
        <div class="input-area">
            <input type="text" id="msgOutbound" placeholder="Message..." onkeypress="if(event.key === 'Enter') handleDispatch()">
            <button onclick="handleDispatch()">Send</button>
        </div>
    </div>

    <script>
        const TARGET_ENDPOINT = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'ws://localhost:8080'
            : 'wss://priv-chat-kwk8.onrender.com';


        const ws = new WebSocket(TARGET_ENDPOINT);
        const feed = document.getElementById('viewport');
        const msgOutbound = document.getElementById('msgOutbound');

        ws.onmessage = async (event) => {
            try {
                const eventPacket = JSON.parse(event.data);
                if (eventPacket.type === 'chat') {
                    const plaintext = await decryptData(eventPacket.payload, eventPacket.iv);
                    renderMessage('them', eventPacket.sender, plaintext);
                }
            } catch (err) {
                console.error(err);
            }
        };

        async function deriveKey(passphrase) {
            const enc = new TextEncoder();
            const hash = await crypto.subtle.digest('SHA-256', enc.encode(passphrase));
            return await crypto.subtle.importKey('raw', hash, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
        }

        async function encryptData(text) {
            const key = await deriveKey(document.getElementById('cryptoSeed').value);
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text));
            return {
                payload: btoa(String.fromCharCode(...new Uint8Array(ciphertext))),
                iv: btoa(String.fromCharCode(...iv))
            };
        }

        async function decryptData(cipher, ivStr) {
            try {
                const key = await deriveKey(document.getElementById('cryptoSeed').value);
                const cipherRaw = new Uint8Array(atob(cipher).split('').map(c => c.charCodeAt(0)));
                const ivRaw = new Uint8Array(atob(ivStr).split('').map(c => c.charCodeAt(0)));
                const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ivRaw }, key, cipherRaw);
                return new TextDecoder().decode(decrypted);
            } catch (e) {
                return "[KEY ERROR]";
            }
        }

        async function handleDispatch() {
            const text = msgOutbound.value.trim();
            if (!text || ws.readyState !== 1) return;
            const cryptoPackage = await encryptData(text);
            ws.send(JSON.stringify({
                type: 'chat',
                sender: document.getElementById('nodeAlias').value || 'Anonymous',
                payload: cryptoPackage.payload,
                iv: cryptoPackage.iv
            }));
            renderMessage('me', 'You', text);
            msgOutbound.value = '';
        }

        function renderMessage(side, user, text) {
            feed.innerHTML += `
                <div class="msg ${side}">
                    <span class="meta">${user}</span>
                    <span>${text}</span>
                </div>
            `;
            feed.scrollTop = feed.scrollHeight;
        }
    </script>
</body>
</html>
